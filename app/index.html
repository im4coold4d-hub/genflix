<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenFlix</title>
    <!-- Tailwind via CDN so styling works instantly without config files -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #141414; color: #ffffff; font-family: sans-serif; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #141414; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
    </style>
</head>
<body>

    <!-- AUTH SCREEN -->
    <div id="auth-screen" class="min-h-screen bg-black flex flex-col items-center justify-center relative">
        <div class="absolute inset-0 opacity-40">
            <img src="https://assets.nflxext.com/ffe/siteui/vlv3/a73c4363-1dcd-4719-b3b1-3725418fd91d/fe1147dd-78be-44aa-a0e5-2d2994305a13/GB-en-20231016-popsignuptwoweeks-perspective_alpha_website_large.jpg" class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-black/70"></div>
        </div>
        <div class="relative z-10 bg-black/85 p-12 rounded-lg w-full max-w-[450px] shadow-2xl">
            <h1 class="text-purple-600 font-black text-4xl mb-6 tracking-tighter">GENFLIX</h1>
            <h2 class="text-2xl font-bold mb-6">Sign In</h2>
            <form id="login-form" class="space-y-4">
                <input type="email" id="email" placeholder="Email address" class="w-full bg-[#333] text-white px-4 py-3.5 rounded focus:outline-none focus:ring-2 focus:ring-purple-600" required>
                <input type="password" id="password" placeholder="Password" class="w-full bg-[#333] text-white px-4 py-3.5 rounded focus:outline-none focus:ring-2 focus:ring-purple-600" required>
                <button type="submit" class="w-full bg-purple-600 font-bold py-3.5 rounded hover:bg-purple-700 transition">Sign In</button>
            </form>
        </div>
    </div>

    <!-- MAIN APP SCREEN (Hidden until logged in) -->
    <div id="main-app" class="hidden min-h-screen relative pb-24">
        <!-- Navigation -->
        <nav class="fixed top-0 left-0 right-0 z-40 px-8 py-4 flex items-center justify-between bg-gradient-to-b from-black via-black/80 to-transparent backdrop-blur-md">
            <h1 class="text-purple-600 font-black text-3xl tracking-tighter">GENFLIX</h1>
            <button onclick="logout()" class="text-sm bg-zinc-800 hover:bg-zinc-700 px-4 py-2 rounded font-semibold transition">Sign Out</button>
        </nav>

        <!-- Hero Banner -->
        <div id="hero-section" class="relative w-full h-screen bg-black flex items-end">
            <!-- Dynamically populated via JS -->
        </div>

        <!-- Movie Grid Row -->
        <div class="px-8 md:px-16 mt-12 space-y-6">
            <h2 class="text-2xl font-bold">Trending on GenFlix</h2>
            <div id="movie-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-5">
                <!-- Dynamically populated via JS -->
            </div>
        </div>
    </div>

    <!-- FULLSCREEN VIDEO PLAYER OVERLAY -->
    <div id="video-player-modal" class="hidden fixed inset-0 z-[9999] bg-black w-screen h-screen flex flex-col items-center justify-center">
        <div class="absolute top-0 left-0 w-full p-6 z-50 bg-gradient-to-b from-black/90 to-transparent flex items-start">
            <button onclick="closePlayer()" class="flex items-center space-x-3 text-white bg-black/60 hover:bg-purple-600 px-6 py-3 rounded-full font-bold transition border border-zinc-700">
                <span class="text-2xl">←</span>
                <span>Back to Browse</span>
            </button>
        </div>
        <video id="active-video-element" controls autoplay playsinline controlsList="nodownload" class="absolute inset-0 w-full h-full object-contain bg-black z-40"></video>
    </div>

    <script>
        // Firebase SDK scripts or your custom Vanilla JS state handlers can go right here
        function closePlayer() {
            const player = document.getElementById('video-player-modal');
            const videoEl = document.getElementById('active-video-element');
            videoEl.pause();
            videoEl.src = "";
            player.classList.add('hidden');
        }

        function logout() {
            document.getElementById('main-app').classList.add('hidden');
            document.getElementById('auth-screen').classList.remove('hidden');
        }
    </script>
</body>
</html>
